<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>القرآن الكريم - محمود علي البنا</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <div class="app-container">
        <!-- =========================================
                 HEADER
            ========================================== -->

        <header class="header">
          <h1>القرآن الكريم</h1>
        </header>

        <!-- =========================================
                 MAIN CARD
            ========================================== -->

        <section class="main-card">
          <!-- =====================================
                     SELECTORS
                ====================================== -->

          <div class="selectors">
            <!-- Surah -->

            <div class="field">
              <label for="surahSelect"> السورة </label>

              <div class="select-wrapper">
                <select id="surahSelect">
                  <option value="">جاري تحميل السور...</option>
                </select>
              </div>
            </div>

            <!-- =====================================
                         GO TO AYAH
                    ====================================== -->

            <div class="go-to-ayah">
              <label for="ayahInput" class="visually-hidden"> رقم الآية </label>

              <input
                type="number"
                id="ayahInput"
                min="1"
                placeholder="رقم الآية"
                inputmode="numeric"
                autocomplete="off"
                enterkeyhint="go"
                aria-label="رقم الآية"
              />

              <button
                type="button"
                id="goToAyahBtn"
                aria-label="اذهب إلى الآية"
              >
                اذهب إلى الآية
              </button>
            </div>

            <!-- Reciter (fixed) -->

            <div class="field">
              <label> القارئ </label>

              <div class="reciter-display">
                <span class="mic"> 🎙️ </span>

                <span> الشيخ محمود علي البنا </span>
              </div>
            </div>
          </div>

          <!-- =====================================
                     SURAH HEADER
                ====================================== -->

          <div class="surah-header">
            <div id="surahName" class="surah-name">اختر سورة</div>
          </div>

          <!-- =====================================
                     AYAH
                ====================================== -->

          <div class="ayah-container" id="ayahContainer">
            <div id="pageView" class="page-view" aria-live="polite">
              <div class="page-loading">اختر سورة لعرض صفحة المصحف</div>
            </div>

            <div id="pageNumber" class="page-number">صفحة —</div>

            <div id="ayahCounter" class="counter">اختر سورة أولًا</div>
          </div>

          <!-- =====================================
                     PROGRESS
                ====================================== -->

          <div class="progress-container">
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>

            <div id="currentTime" class="time">00:00</div>
          </div>

          <!-- =====================================
                     CONTROLS
                ====================================== -->

          <div class="controls">
            <button
              id="playBtn"
              class="control-btn play-btn"
              type="button"
              aria-label="تشغيل"
            >
              <span> ▶ </span>

              <span> تشغيل </span>
            </button>
          </div>

          <!-- =====================================
                     FULLSCREEN
                ====================================== -->

          <div class="secondary-controls">
            <button id="fullscreenBtn" class="fullscreen-btn" type="button">
              ⛶ عرض ملء الشاشة
            </button>
          </div>
        </section>

        <!-- =========================================
                 AUDIO
            ========================================== -->
        <audio
          id="audio"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></audio>
      </div>
    </main>

    <!-- APP JS -->

    <script src="quran-core.js"></script>
    <script src="quran-audio.js"></script>
    <script src="app.js"></script>
  </body>
</html>
